apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// CI passes the release tag without its "v": -PappVersion=1.2.3.
def appVersion = (findProperty('appVersion') ?: '0.0.0').toString()
def versionParts = appVersion.tokenize('.-+').take(3).collect { it.toInteger() }
if (versionParts.size() != 3 || versionParts[1] > 999 || versionParts[2] > 999) {
    throw new GradleException("appVersion must be major.minor.patch with minor and patch below 1000, got '${appVersion}'")
}

def keystoreFile = System.getenv('ANDROID_KEYSTORE_FILE')

android {
    // The application id never changes: a different id is a different app
    // with an empty database (AGENTS.md, invariant 11).
    namespace = "fi.eerolehtinen.lift"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "fi.eerolehtinen.lift"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Android refuses to install a lower code over a higher one. The
        // code must be positive, also for the 0.0.0 of local builds.
        versionCode Math.max(1, versionParts[0] * 1_000_000 + versionParts[1] * 1_000 + versionParts[2])
        versionName appVersion
        aaptOptions {
            // Capacitor's pattern: the default one drops files starting with "_".
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (keystoreFile) {
            release {
                storeFile file(keystoreFile)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            // Installs next to the release app, with its own database.
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            // Without the keystore the APK is unsigned and can't be
            // installed. Never fall back to the debug key: replacing a
            // debug-signed install needs an uninstall, which deletes the
            // database.
            if (keystoreFile) {
                signingConfig signingConfigs.release
            }
        }
    }
}

kotlin {
    jvmToolchain(21)
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-ktx:$androidxCoreVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
