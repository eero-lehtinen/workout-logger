name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from packageManager in package.json.
      - uses: pnpm/setup@v3
        with:
          runtime: node@26
          cache: true
          install: false

      - run: pnpm install --frozen-lockfile
      # Story tests and e2e tests run in Chromium.
      - run: pnpm --filter @workout-logger/web exec playwright install --with-deps chromium
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm e2e

      - name: Check committed route tree is up to date
        run: git diff --exit-code -- apps/web/src/routeTree.gen.ts
