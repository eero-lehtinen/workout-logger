name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  check:
    runs-on: ubuntu-latest
    # A hung download otherwise holds the run for the 6-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from packageManager in package.json.
      - uses: pnpm/setup@v3
        with:
          runtime: node@26
          cache: true
          install: false

      - run: pnpm install --frozen-lockfile
      # Story tests and e2e tests run headless, so the headless shell is
      # enough. No --with-deps: the runner image already has Chromium's
      # libraries, and the extra fonts it would add came from a mirror that
      # sometimes took minutes.
      - id: playwright
        run: echo "version=$(pnpm --filter @workout-logger/web exec playwright --version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ steps.playwright.outputs.version }}-headless-shell
      - run: pnpm --filter @workout-logger/web exec playwright install --only-shell chromium
        timeout-minutes: 5
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm e2e

      - name: Check committed route tree is up to date
        run: git diff --exit-code -- apps/web/src/routeTree.gen.ts

  # Keeps the Android build working between releases.
  android:
    if: "!startsWith(github.ref, 'refs/tags/v')"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/android-setup
      - run: ./gradlew assembleDebug
        working-directory: apps/android

  # A tag v<major>.<minor>.<patch> publishes a signed APK as a GitHub
  # release; the server offers it to installed apps (docs/deployment.md).
  android-release:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The release notes are the commits since the previous tag.
          fetch-depth: 0
      - uses: ./.github/actions/android-setup

      - name: Build the signed APK
        working-directory: apps/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"
          ./gradlew assembleRelease "-PappVersion=$version"
          rm "$ANDROID_KEYSTORE_FILE"
          # Fails on an unsigned APK, which no phone could install.
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$apksigner" verify app/build/outputs/apk/release/app-release.apk
          mv app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/workout-logger-$version.apk"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="$RUNNER_TEMP/workout-logger-${GITHUB_REF_NAME#v}.apk"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$apk" --clobber
            exit 0
          fi
          # GitHub's generated notes list merged pull requests, and work
          # here lands on main without them. List what changed for users
          # instead: the feat and fix commits since the previous release.
          previous=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^" 2> /dev/null || true)
          notes="$RUNNER_TEMP/notes.md"
          git log --no-merges --format='- %s' --extended-regexp --grep='^(feat|fix)(\(.+\))?!?:' \
            ${previous:+"$previous.."}"$GITHUB_REF_NAME" > "$notes"
          if [ ! -s "$notes" ]; then echo "No user-facing changes." > "$notes"; fi
          gh release create "$GITHUB_REF_NAME" "$apk" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$notes"
  image:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      LIVE_UPDATE_PRIVATE_KEY: ${{ secrets.LIVE_UPDATE_PRIVATE_KEY }}
    steps:
      # Installed apps refuse an unsigned web build, and nothing else would
      # report that live updates have stopped (docs/deployment.md).
      - name: Require the live-update signing key
        run: |
          if [ -z "$LIVE_UPDATE_PRIVATE_KEY" ]; then
            echo "The LIVE_UPDATE_PRIVATE_KEY secret is not set" >&2
            exit 1
          fi
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Tagged only with the commit SHA, never `latest`, so a deploy and a
      # rollback always name exactly one build.
      - uses: docker/build-push-action@v7
        with:
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: GIT_COMMIT=${{ github.sha }}
          secret-envs: live_update_private_key=LIVE_UPDATE_PRIVATE_KEY
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOKPLOY_URL: https://dokploy.eerolehtinen.fi
      DOKPLOY_COMPOSE_ID: hTEouGN6Ll3gpBPG7v99Q
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
      APP_URL: https://lift.eerolehtinen.fi
    steps:
      - uses: actions/checkout@v7

      # Dokploy's deploy webhooks can't choose an image tag, so the compose
      # file with the tag filled in is uploaded through the API before the
      # deploy is queued.
      - name: Deploy to Dokploy
        run: |
          compose=$(sed "s|\${IMAGE_TAG}|$GITHUB_SHA|g" deploy/compose.yaml)
          api() {
            curl --fail-with-body --silent --show-error -X POST \
              -H "x-api-key: $DOKPLOY_API_KEY" -H "content-type: application/json" \
              --data "$2" "$DOKPLOY_URL/api/$1"
            echo
          }
          api compose.update "$(jq -n --arg id "$DOKPLOY_COMPOSE_ID" --arg file "$compose" \
            '{composeId: $id, composeFile: $file}')" > /dev/null
          api compose.deploy "$(jq -n --arg id "$DOKPLOY_COMPOSE_ID" --arg sha "$GITHUB_SHA" \
            '{composeId: $id, title: ("CI " + $sha[0:7])}')"

      - name: Wait for the new version
        run: |
          for attempt in $(seq 60); do
            # Until the container is up, Traefik answers with a plain-text 404.
            # A new query string per attempt never hits a Cloudflare-cached
            # answer, even one cached from a server that didn't send no-store.
            commit=$(curl --silent "$APP_URL/api/status?deploy=$GITHUB_SHA-$attempt" | jq -r '.commit // empty' 2> /dev/null || true)
            if [ "$commit" = "$GITHUB_SHA" ]; then
              echo "$APP_URL serves $commit"
              exit 0
            fi
            sleep 5
          done
          echo "$APP_URL still serves '${commit:-nothing}' after 5 minutes" >&2
          exit 1
