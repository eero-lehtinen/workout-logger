name: Android setup
description: >
  Installs the toolchain, builds the web app, and syncs it into apps/android,
  so that Gradle can build an APK. The runner image provides the Android SDK.

runs:
  using: composite
  steps:
    # Reads the pnpm version from packageManager in package.json.
    - uses: pnpm/setup@v3
      with:
        runtime: node@26
        cache: true
        install: false
    - run: pnpm install --frozen-lockfile
      shell: bash
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: 21
    - uses: gradle/actions/setup-gradle@v6
    - run: pnpm android:sync
      shell: bash
