name: Android setup
description: >
  Installs the toolchain, builds the web app, and syncs it into apps/android,
  so that Gradle can build an APK. The runner image provides the Android SDK.

runs:
  using: composite
  steps:
    - uses: ./.github/actions/node-setup
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: 21
    - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
    - run: pnpm android:sync
      shell: bash
